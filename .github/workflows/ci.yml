name: CI

# No pull_request trigger: main is the only branch this repository has, so a
# push to it is the only event there is. workflow_dispatch is kept so the
# heavy dependency job can be run on demand.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Mondays at 06:00 UTC. The dependency job is the only reason for a
    # scheduled run: requirements.txt can stop resolving without anyone
    # touching this repository.
    - cron: "0 6 * * 1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # ruff parses the sources rather than importing them, so this job needs
      # none of the runtime dependencies and finishes in seconds.
      - run: ruff check .

  # The documentation and workflow guards, on their own and first. They read
  # the repository's own files and import nothing from Tyche, so they need
  # pytest and a YAML parser and nothing else — which makes them the checks
  # that answer in twenty seconds instead of five minutes, and the ones that
  # keep the six products aligned.
  docs:
    name: Documentation guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pytest pyyaml
      - run: python -m pytest tests/test_docs.py tests/test_release_workflow.py -q

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # tkinter is an OS package and it has to match the interpreter running
      # the tests — the trap CLAUDE.md describes, where python3-tk installs
      # the module for one interpreter and the tests run under another.
      # setup-python ships its own `_tkinter` module, but that extension still
      # links against the runner's libtcl/libtk at load time, and python3-tk
      # is what pulls those in. Installing it is therefore right here and is
      # *not* how the module itself gets found.
      #
      # Windows needs none of this: its Python ships Tcl/Tk in the installer
      # and the runner has a real desktop, so there is nothing to install and
      # no virtual display to start.
      - name: Install Xvfb and the Tk runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk

      - name: Confirm tkinter is importable by the interpreter under test
        # Without this, a missing Tk shows up as twelve failing GUI tests and
        # reads like a code regression.
        run: python -c "import tkinter; print('tkinter', tkinter.TkVersion)"

      # The lean set. requirements.txt also pulls TimesFM and PyTorch, which
      # together are gigabytes and which no test needs: core/forecaster.py is
      # written to report a missing model rather than raise, and there is a
      # test asserting exactly that. The dependencies job below is what checks
      # the full file still resolves.
      # pyyaml is here for tests/test_release_workflow.py, which parses the
      # workflow files. Without it that module fails at collection and the
      # guards on the file that publishes releases stop being run.
      - run: pip install numpy requests customtkinter pytest pyyaml

      - name: Tests, GUI included
        # The whole point of the switch: without it a machine with no display
        # reports "70 passed, 1 skipped" and has tested no interface at all.
        #
        # Two `run:` lines for one command, because Windows has no xvfb-run
        # and needs none. tests/test_release_workflow.py asserts the Linux one
        # is byte-identical to the release workflow's, so the suite that gates
        # a release and the suite that gates a commit stay the same suite.
        if: runner.os == 'Linux'
        env:
          TYCHE_REQUIRE_GUI: "1"
        run: xvfb-run -a python -m pytest tests/ -q

      - name: Tests, GUI included (Windows)
        if: runner.os == 'Windows'
        env:
          TYCHE_REQUIRE_GUI: "1"
        run: python -m pytest tests/ -q

      - name: Version reports without importing the GUI
        run: python main.py --version

      - name: --check explains itself when there is no archive
        # data/ is git-ignored, so a fresh checkout has none. Exit code 1 with
        # an explanation is the contract; a traceback or a silent 0 is not.
        #
        # Linux only: this is a POSIX shell script, and what it checks is a
        # property of the program rather than of the platform.
        if: runner.os == 'Linux'
        run: |
          set +e
          output=$(python main.py --check); code=$?
          set -e
          echo "$output"
          test "$code" = "1" || { echo "expected exit 1, got $code"; exit 1; }
          # main.NO_ARCHIVE. tests/test_release_workflow.py fails if the two
          # stop agreeing, which is how the English original survived the
          # translation into a red build.
          echo "$output" | grep -q "Nessun archivio in" || { echo "no explanation"; exit 1; }

  dependencies:
    # Slow and rarely interesting: it exists to catch requirements.txt no
    # longer resolving, which is a supply-chain event rather than a code
    # change. Manual and weekly only.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with a CPU-only PyTorch
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: TimesFM imports and the wrapper agrees with its config
        # Not a forecast: the 3.0 weights are 1.3 GB and non-commercial, and
        # downloading them on every scheduled run would be rude as well as
        # slow. This checks the API the wrapper is written against still
        # exists, which is the part that can break under us.
        run: |
          python - <<'PY'
          import dataclasses
          from timesfm3 import ModelConfig, TimesFM3Evaluator
          fields = {f.name for f in dataclasses.fields(ModelConfig)}
          required = {"checkpoint_path", "device", "per_core_batch_size", "token"}
          missing = required - fields
          assert not missing, f"core/forecaster.py passes unknown ModelConfig fields: {missing}"
          assert hasattr(TimesFM3Evaluator, "predict_batch")
          print("TimesFM 3.0 API matches what core/forecaster.py expects")
          PY

  forecast:
    # The only thing in this repository that downloads the 1.3 GB TimesFM
    # checkpoint and runs a real forward pass. Everything else about the
    # forecaster is covered by tests that stop short of the weights, so this
    # is the job that answers "does core/forecaster.py actually work" —
    # a question the sandbox it was written in could not answer, because
    # Hugging Face was blocked there.
    #
    # Manual only. Weights that size do not belong in a weekly run, and the
    # answer does not change unless core/forecaster.py or TimesFM does.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with a CPU-only PyTorch
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      # Without this the job downloads 1.3 GB from Hugging Face on every run,
      # and three dispatches inside ten minutes earned an HTTP 429 and a red
      # build that had nothing to do with the code. Unauthenticated Hub
      # traffic is rate-limited; caching is the fix that does not require
      # putting a token in the repository.
      - name: Cache the TimesFM checkpoint
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: timesfm-3.0-pytorch

      - name: Bootstrap the archive
        # Also the only place the bulk source is fetched over a real network
        # by anything other than a person clicking the button.
        run: python main.py --update --yes

      - name: Forecast with a baseline first
        # If this fails the problem is not TimesFM, and knowing that before
        # a 1.3 GB download is worth one second.
        run: python main.py --forecast frequenza

      - name: Forecast with TimesFM 3.0
        run: python main.py --forecast timesfm

      - name: The forecast has to be ninety usable scores
        # A wrapper can "work" and still return NaNs, a flat line, or the
        # wrong number of series — the shapes that would make the validation
        # harness silently score noise.
        run: |
          python - <<'PY'
          import math
          from core.archive import load_archive
          from core.data_manager import ARCHIVE_PATH, load_settings
          from core.forecaster import TimesFMForecaster

          settings = load_settings()
          draws = load_archive(ARCHIVE_PATH)
          model = TimesFMForecaster(
              checkpoint=settings["timesfm_checkpoint"],
              device="cpu",
              context_length=int(settings["context_length"]),
              representation=settings["representation"],
              window=int(settings["frequency_window"]),
          )
          assert model.load_model(), "the checkpoint did not load"
          scores = model.score_numbers(draws)

          assert set(scores) == set(range(1, 91)), f"got {len(scores)} series, expected 90"
          assert all(math.isfinite(v) for v in scores.values()), "non-finite forecasts"
          spread = max(scores.values()) - min(scores.values())
          assert spread > 0, "every number scored identically — the ranking would be arbitrary"
          print(f"90 finite scores, spread {spread:.6f}")
          print("top six:", sorted(scores, key=scores.get, reverse=True)[:6])

          # How much of the forecast is just the last value of each series?
          # The first run of this job showed TimesFM's top six sharing five
          # numbers with the plain frequency baseline and its spread matching
          # to four decimals, which is what a persistence forecast looks like.
          # Measured rather than asserted: it is a fact about this data, not a
          # contract the model owes anyone.
          import numpy as np

          from core.features import build_context

          context = build_context(
              draws,
              representation=settings["representation"],
              window=int(settings["frequency_window"]),
              context_length=int(settings["context_length"]),
          )
          last = context[:, -1].astype(float)
          predicted = np.array([scores[n] for n in range(1, 91)])
          correlation = float(np.corrcoef(last, predicted)[0, 1])
          drift = float(np.mean(np.abs(predicted - last)))
          print(f"correlation with the last observed value: {correlation:+.4f}")
          print(f"mean absolute change from it: {drift:.6f} "
                f"({drift / max(spread, 1e-12):.1%} of the score spread)")
          PY

      - name: Drive the walk-forward harness through the real model
        # Twelve draws, and the number is load-bearing. One forward pass over
        # ninety variates and a 1024-draw context costs about thirty seconds on
        # a two-core runner, so the first version of this step asked for sixty
        # and spent half an hour before the job timed out — a red build that
        # said nothing about the code. The purpose here is that walk_forward
        # can drive the real model end to end, which twelve calls establish as
        # well as sixty; the statistics are the Validate tab's job, on a
        # machine somebody is sitting at.
        #
        # The per-call timing is printed so the next person to change this
        # number is changing it from evidence.
        run: |
          python - <<'PY'
          import time

          from core.archive import load_archive
          from core.data_manager import ARCHIVE_PATH, load_settings
          from core.forecaster import TimesFMForecaster
          from core.validation import walk_forward

          settings = load_settings()
          draws = load_archive(ARCHIVE_PATH)
          model = TimesFMForecaster(
              checkpoint=settings["timesfm_checkpoint"], device="cpu",
              context_length=int(settings["context_length"]),
              representation=settings["representation"],
              window=int(settings["frequency_window"]),
          )
          assert model.load_model()

          scored = 12
          started = time.monotonic()
          report = walk_forward(
              draws, methods=["timesfm", "frequenza", "casuale"],
              n_draws=scored, forecaster=model,
          )
          elapsed = time.monotonic() - started

          for result in report.results:
              print(result.summary())
          print(f"\n{report.verdict()}")
          print(f"\n{elapsed:.0f}s for {scored} draws — {elapsed / scored:.1f}s per model call")
          PY

  checkpoint-licence:
    # A diagnostic, not a test, and manual only.
    #
    # The `timesfm` *package* is Apache-2.0. The *weights* each checkpoint
    # downloads carry their own terms, and Tyche's documentation records that
    # google/timesfm-3.0-pytorch is under timesfm-non-commercial-license-v1.0
    # — non-commercial, non-production. That is fine for a private tool and
    # decisive for anything sold, so it is the single fact any licensing
    # decision about this program turns on.
    #
    # It has never been checked from this repository. Hugging Face is blocked
    # by the egress policy of the environment Tyche was written in (403 through
    # the proxy), so the claim is documentation quoting documentation. A GitHub
    # runner has the network to ask the model card directly.
    #
    # Prints rather than asserts. A licence that changed would be news, not a
    # build failure, and the answer wanted here is a string a human reads.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: What licence does each checkpoint declare?
        run: |
          python - <<'PY'
          import json

          import requests

          # The one Tyche uses, the one Argus used before 1.1.0, and the
          # 200M 3.0 in case a smaller commercially-usable option exists.
          CHECKPOINTS = (
              "google/timesfm-3.0-pytorch",
              "google/timesfm-2.5-200m-pytorch",
              "google/timesfm-1.0-200m-pytorch",
          )

          for repo in CHECKPOINTS:
              print(f"\n=== {repo}")
              try:
                  r = requests.get(
                      f"https://huggingface.co/api/models/{repo}",
                      timeout=30,
                      headers={"User-Agent": "Tyche (licence check)"},
                  )
              except Exception as exc:
                  print(f"  unreachable: {exc}")
                  continue
              print(f"  HTTP {r.status_code}")
              if r.status_code != 200:
                  # 401 here means gated: the terms have to be accepted on the
                  # site before the weights download at all, which is itself
                  # part of the answer.
                  print(f"  {r.text[:200]}")
                  continue
              data = r.json()
              card = data.get("cardData") or {}
              print(f"  cardData.license      : {card.get('license')}")
              print(f"  cardData.license_name : {card.get('license_name')}")
              print(f"  cardData.license_link : {card.get('license_link')}")
              print(f"  gated                 : {data.get('gated')}")
              licence_tags = [t for t in data.get("tags", []) if t.startswith("license")]
              print(f"  licence tags          : {licence_tags}")
              files = [s.get("rfilename") for s in data.get("siblings", []) or []]
              print(f"  licence files in repo : "
                    f"{[f for f in files if f and 'LICENSE' in f.upper()]}")

          print(
              "\nRead the 'license' field, not this job's exit code: it prints "
              "and never fails.\nA non-commercial licence on the checkpoint "
              "Tyche defaults to is the fact that\ndecides whether this program "
              "can carry a commercial licence of its own."
          )
          PY

  scraper-recon:
    # A diagnostic, not a test, and manual only.
    #
    # core/sources/html_table.py has never met a live page: every Italian
    # lottery host is blocked from the environment it was written in, so its
    # four candidate URLs are four guesses. The first real run graded them —
    # three answered HTTP 404 and one failed TLS verification, which is a much
    # better position than it sounds. The hosts are up and reachable; only the
    # paths are wrong, and a wrong path is a one-line fix.
    #
    # This job prints the archive-looking links each homepage actually offers,
    # which is the information needed to make that fix and the one thing a
    # blocked sandbox cannot obtain. A handful of GETs to public pages, under
    # Tyche's own honest user agent, on demand.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Does the inferred estrazioni.it download URL actually work?
        # core/sources/estrazioni_it.py guesses this URL from two others on the
        # site. This is the step that turns the guess into a fact, or tells us
        # it is wrong before a user finds out. Not allowed to fail the job:
        # the recon output below is what a failure needs in order to be fixed.
        continue-on-error: true
        run: |
          python - <<'PY'
          from core.sources.estrazioni_it import DOWNLOAD_URLS, EstrazioniItSource
          from core.sources.base import SourceError, http_get

          for url in DOWNLOAD_URLS:
              try:
                  payload = http_get(url)
                  head = payload[:120].decode("utf-8-sig", errors="replace").splitlines()
                  print(f"{len(payload):>9,} bytes  {url}")
                  print(f"           first line: {head[0] if head else '(empty)'}")
              except SourceError as exc:
                  print(f"{'failed':>9}  {exc}")

          draws = EstrazioniItSource().fetch()
          print(f"\nparsed {len(draws):,} draws, {min(d.date for d in draws)} "
                f"to {max(d.date for d in draws)}")
          PY

      - name: What do these hosts actually publish?
        run: |
          python - <<'PY'
          import re

          from core.sources.base import USER_AGENT
          import requests

          HOSTS = [
              # The site the archive currently comes from. Its per-year page is
              # known; what is wanted is the URL behind its CSV export, so this
              # one is fetched at the page a person would be looking at.
              "https://estrazioni.it/index.php?p=home&anno=2026&tipo=superenalotto",
              "https://www.estrazionedellotto.it/",
              "https://www.superenalotto.it/archivio-estrazioni",
              "https://www.lottologia.com/",
          ]
          LINK = re.compile(r'(?:href|action|data-url)=["\']([^"\']+)["\']', re.IGNORECASE)
          INTERESTING = (
              "archivio", "estrazioni", "storico", "archive",
              # What a download link looks like on these sites.
              "csv", "download", "scarica", "export", "esporta", "txt", "xls",
          )

          for host in HOSTS:
              print(f"\n=== {host}")
              try:
                  response = requests.get(
                      host, timeout=20,
                      headers={"User-Agent": USER_AGENT, "Accept": "*/*"},
                  )
              except Exception as exc:
                  print(f"  unreachable: {type(exc).__name__}")
                  continue
              print(f"  HTTP {response.status_code}, {len(response.content):,} bytes")
              if response.status_code != 200:
                  continue
              seen = []
              for href in LINK.findall(response.text):
                  low = href.lower()
                  if any(word in low for word in INTERESTING) and href not in seen:
                      seen.append(href)
              for href in seen[:25]:
                  print(f"    {href}")
              if not seen:
                  print("    no archive-looking links on the homepage")
          PY
